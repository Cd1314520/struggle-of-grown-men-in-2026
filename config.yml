# Settings for this machine and its owner (the public addresses, the mailbox, the resume's file name)
# go in config.local.yml, which is not tracked: see config.local.example.yml.

# App settings. Every one can be changed on the Settings page, which writes the change to config.local.yml;
# most take effect at once (port, chrome, concurrency.fill and resume wait for a restart). Restart the
# server after editing either file by hand.
port: 8787

# How you reach the app and the live browser view (served over the tailnet by `tailscale serve`).
# Used for the Gmail OAuth redirect and the links in the UI. null = http://localhost:<port>.
publicUrl: null
vncUrl: null

# The dedicated application mailbox. Connecting any other Google account is refused.
mailbox: null

# One daily plaintext questions digest to this same connected mailbox, never another recipient.
# Each unchanged group is notified once; adding jobs does not re-notify it. Send-now in Settings
# bypasses this schedule, not deduplication. Uncertain sends reconcile against Sent, never blindly retry.
questionDigest:
  enabled: true
  time: "09:00"
  timeZone: America/Chicago

# Who gives the go-ahead for an application.
#   auto   the app approves the jobs that clear autoApply below, and sends every application without
#          asking again. Jobs you add or send back by hand, and questions the agent can't answer, still wait for you.
#   gated  you approve every job in Review, and OK every filled-in application before it is sent.
approval: auto

# Target employers: the ones you are saving for later. The frontier list in profile/employers.yml, plus
# any employer the assessment judges to fit `describe` (empty or null: the list alone).
#   holdBack: true   their jobs are set aside in Archive → Held, and the rest are applied to (practice)
#   holdBack: false  they are applied to as well; a target's job is scored on the `real` rubric in
#                    profile/rubric.yml, any other on the `practice` one
# Judgments are remembered per employer against these exact words: changing them judges employers afresh.
targets:
  holdBack: true
  describe: >-
    A software or tech-first company past early stage (roughly 300+ people, or a large established product)
    whose core product is the software, including well-funded, scaled AI-native companies. Not an early-stage
    startup, a non-tech business (insurance, banking, energy, healthcare, retail, manufacturing, logistics,
    media, education), an IT services, consulting or staffing firm, or government and its contractors. Who
    the customers are does not decide it: a tech company at scale that sells its own products to governments
    counts.

# Models per stage. null = whatever omp's default role resolves to. A claude-code/<model> one (claude-code/opus,
# claude-code/sonnet, ...) runs on Claude Code instead of omp (docs/harnesses.md). Settings → Models changes them
# without a restart, writing the choice to config.local.yml.
models:
  triage: claude-code/claude-haiku-5-5 # pass over raw titles
  discover: claude-code/sonnet # web search for companies and postings
  locate: claude-code/sonnet # web search for the employer's own posting of a LinkedIn/Indeed job
  screen: claude-code/claude-haiku-5-5 # reads each posting for plain dealbreakers before prep
  prep: claude-code/sonnet # scoring + resume tailoring
  fill: claude-code/opus # form filling in the browser
  track: claude-code/sonnet
  recheck: claude-code/opus # answers parked questions the profile now settles
  import: claude-code/opus # turns uploaded resume files into the Typst resume (Resume page)

# Scoring weights and thresholds live in profile/rubric.yml.

# The bar for the approvals the app gives itself (approval: auto). A practice job must also be proven
# one: its employer judged not a target. Anything that misses the bar waits for you in Review.
autoApply:
  minScore: 60 # align with the practice interview-fit threshold; score alone never makes a job practice
  allowConcerns: true # expected dealbreakers are the point; hard requirements and evidence gates still apply
  perDay: 100 # auto-approvals a day; limits.applyPerDay still caps new applications
  perEmployer: 1 # applications per employer, ever (sent or under way); further passing roles there wait for your review

# Minutes between automatic runs. 0 disables that run (use the UI buttons).
#   scan      re-reads every watched company board and the feeds below; only new postings cost anything
#   discover  an agent searches the web for more companies and postings to watch
#   track     reads the mailbox for replies to applications
schedule:
  scanMinutes: 30
  discoverMinutes: 0 # off: 1,800+ boards are watched already
  trackMinutes: 120

# Remote-job aggregators, read during a scan but no more often than `minutes` each (they ask for a
# few requests a day). A role also listed on a company board is folded into that one job.
feeds:
  remotive: { minutes: 480, categories: [software-development, artificial-intelligence, data] }
  jobicy: { minutes: 360, geo: usa, industries: [dev, data-science], count: 50 }
  remoteok: { minutes: 360, tags: [python, ai, junior] }

# LinkedIn and Indeed job search, read logged out with no account during a scan. They only say what is
# open: each posting that passes triage is then looked up on the employer's own site (its public job
# board if it has one, otherwise an agent searching the web) and applied to there. One with no
# posting of the employer's own is skipped. Neither site permits automated reading, so requests are
# kept few; a refusal pauses that site for 6 hours. minutes: 0 turns a site off.
# Nationwide, since relocation is fine; the distance does not narrow a country-wide search.
boards:
  location: United States
  distance: 25 # miles
  queries: [software engineer, AI engineer, AI agent engineer]
  initialHours: 72 # how far back the first scan looks; later scans ask only for what is new since the last
  linkedin: { minutes: 60, pages: 2 } # newest first, 10 a page, per query: 3 to 6 requests an hour
  indeed: { minutes: 60 } # one request per query, up to 100 postings each

# Concurrency. prep = assessments at once. fill = applications at once, each in its own Chrome
# (own display, profile and ports, counted up from the `chrome` values below; live views on
# vncPort, vncPort+1, ...). Two applications to the same employer never run together, and a new one waits
# while another to that employer is parked or resuming.
concurrency:
  prep: 5
  fill: 5

# Daily caps on agent work: assessments, posting look-ups, and application attempts (including blocked or failed starts).
limits:
  prepPerDay: 1500
  locatePerDay: 40 # LinkedIn/Indeed postings handed to the web-search agent
  applyPerDay: 100 # new applications; resuming one already started does not count
  applySpreadHours: 24 # new applications start at most one per applySpreadHours / applyPerDay (about 14 minutes); postings opened in the last day skip the wait; 0 = as fast as browsers allow

# Seconds a browser rests between applications, randomised within the range. Applications in
# different browsers also start at least the lower number of seconds apart.
fillPauseSeconds: [60, 240]

# Stock resume: a Typst project. `main` holds the content the agent tailors; other .typ files are
# the template and are never edited. Every compiled copy, stock or tailored, is named `pdfName`.
resume:
  dir: basic-resume
  main: main.typ
  pdfName: resume.pdf

chrome:
  cdpPort: 9222
  proxyPort: 9223 # agents connect here: same browser, with mouse and keyboard input paced like a person's
  display: ":99"
  window: [1440, 900]
  vncPort: 6080 # noVNC for manual takeover (localhost only); 0 disables

# Agents' step-by-step records (each step, tool call and message) are removed after this many days;
# 0 keeps them for good. Approvals, gates, errors, mail and your own actions are never removed.
retention:
  chatterDays: 30
