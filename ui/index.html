<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Apply</title>
<style>
  :root {
    --bg:#ffffff; --side:#f7f7f6; --hover:#f1f1ef; --sel:#ebeef8; --line:#e7e6e3; --text:#1b1b19; --sub:#5a5954; --faint:#73726c;
    --accent:#3451d1; --accent-ink:#fff; --good:#1f7a48; --good-bg:#e6f4ec; --warn:#8f5400; --warn-bg:#fdf1dc; --bad:#b4322a; --bad-bg:#fbe9e7; --info-bg:#e8ecfb;
    --font:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono:ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#151514; --side:#1a1a19; --hover:#222220; --sel:#232a44; --line:#2c2c29; --text:#ecebe6; --sub:#b0afa8; --faint:#8f8e87;
    --accent:#8aa2ff; --accent-ink:#10131f; --good:#6fcf97; --good-bg:#16301f; --warn:#e7b25a; --warn-bg:#34280f; --bad:#f08a80; --bad-bg:#3a1b18; --info-bg:#1d2440;
  } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased; }
  button, input, textarea, select { font:inherit; color:inherit; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  h1, h2, h3, p, ul, dl, dd { margin:0; } ul { padding-left:18px; }
  code { font:12.5px var(--mono); }

  #app { display:grid; grid-template-columns:208px minmax(300px, 380px) minmax(0, 1fr); height:100vh; }
  #app.wide { grid-template-columns:208px minmax(0, 1fr); }
  #app.wide #list { display:none; }

  /* sidebar */
  #side { background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:16px 10px 14px; overflow:auto; }
  .brand { font-weight:700; font-size:15px; padding:2px 10px 12px; letter-spacing:-.01em; }
  .navgroup { font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; padding:16px 10px 4px; }
  .nav { display:flex; align-items:center; gap:8px; width:100%; border:0; background:none; text-align:left; padding:6px 10px; border-radius:6px; cursor:pointer; color:var(--sub); }
  .nav:hover { background:var(--hover); color:var(--text); }
  .nav.on { background:var(--sel); color:var(--text); font-weight:600; }
  .nav .n { margin-left:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; font-weight:400; }
  .nav .n.hot { background:var(--accent); color:var(--accent-ink); border-radius:9px; padding:0 7px; font-weight:600; }
  .nav .n.hot.stuck { background:var(--warn); color:var(--bg); }
  .nav.m-only { display:none; }
  .sidefoot { margin-top:auto; padding:12px 10px 0; font-size:12px; color:var(--faint); display:grid; gap:8px; white-space:nowrap; }
  .scrollx { overflow-x:auto; -webkit-mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent); }

  /* list */
  #list { border-right:1px solid var(--line); overflow:auto; padding-bottom:24px; }
  .head { padding:18px 20px 4px; display:flex; align-items:baseline; gap:8px; }
  .head h1 { font-size:16px; font-weight:700; letter-spacing:-.01em; }
  .page .head h1 { font-size:20px; letter-spacing:-.02em; }
  .head .count { color:var(--faint); font-size:13px; }
  .group { display:flex; align-items:baseline; gap:8px; margin-top:16px; padding:6px 20px 5px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); background:var(--bg); border-bottom:1px solid var(--line); }
  .group b { font-weight:700; color:var(--sub); }
  .group i { font-style:normal; margin-left:auto; font-variant-numeric:tabular-nums; }
  .group span { text-transform:none; letter-spacing:0; font-weight:400; }
  .group.hot b { color:var(--warn); }
  .head + .group, .filters + .group, .search + .group { margin-top:8px; }
  .head + .row { margin-top:6px; }
  @media (min-width: 861px) { .group { position:sticky; top:0; z-index:1; } }
  .row { display:grid; grid-template-columns:minmax(0, 1fr) auto; column-gap:12px; padding:8px 20px; cursor:pointer; }
  .row:hover { background:var(--hover); }
  .row.sel { background:var(--sel); }
  .row .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .m { grid-column:1; color:var(--sub); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .m:empty { display:none; }
  .row.stuck .t::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--warn); margin-right:7px; vertical-align:1px; }
  .row.stuck.failed .t::before { background:var(--bad); }
  .search { padding:8px 20px 0; }
  .search input { padding:6px 10px; }
  .row .side { grid-row:1 / span 2; grid-column:2; align-self:center; display:flex; align-items:center; gap:10px; }
  .row .m b { font-weight:500; color:var(--text); }
  .row .score { min-width:24px; text-align:right; }
  .age { font-size:12px; font-variant-numeric:tabular-nums; color:var(--faint); white-space:nowrap; }
  .age.today { color:var(--text); font-weight:600; }
  .age.hot { color:var(--warn); background:var(--warn-bg); font-weight:700; border-radius:99px; padding:1px 8px; }
  .fold { display:block; width:100%; border:0; background:none; text-align:left; padding:5px 20px 9px; font-size:13px; color:var(--accent); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fold:hover { text-decoration:underline; }
  .score { font-variant-numeric:tabular-nums; font-weight:600; font-size:13px; color:var(--sub); }
  .score.low { color:var(--bad); }
  .tag { font-weight:600; } .tag.need { color:var(--warn); } .tag.ok { color:var(--good); } .tag.bad { color:var(--bad); } .tag.run { color:var(--accent); } .tag.idle { color:var(--faint); }
  .filters { display:flex; flex-wrap:wrap; gap:6px; padding:8px 20px 6px; scrollbar-width:none; }
  .filters::-webkit-scrollbar { display:none; }
  .doc .filters { padding:0 0 4px; }
  .fchip { flex:none; border:1px solid var(--line); background:none; border-radius:99px; padding:3px 11px; font-size:13px; color:var(--sub); cursor:pointer; white-space:nowrap; }
  .fchip:hover { background:var(--hover); color:var(--text); }
  .fchip.on { background:var(--text); border-color:var(--text); color:var(--bg); font-weight:600; }
  .fchip i { font-style:normal; opacity:.75; margin-left:5px; font-variant-numeric:tabular-nums; }
  .filters + .row { margin-top:4px; }
  .empty { padding:56px 24px; text-align:center; color:var(--faint); }

  /* document pane */
  #pane { overflow:auto; }
  .doc { max-width:760px; padding:26px 40px 80px; }
  .doc.page { margin:0 auto; }
  .btn.back { display:none; }
  .eyebrow { color:var(--sub); font-size:13px; display:flex; gap:12px; flex-wrap:wrap; }
  .doc h2 { font-size:24px; line-height:1.2; font-weight:700; letter-spacing:-.02em; margin:4px 0 6px; }
  .facts { color:var(--sub); display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; }
  .pill { display:inline-flex; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; background:var(--hover); color:var(--sub); }
  .pill.ok { background:var(--good-bg); color:var(--good); } .pill.bad { background:var(--bad-bg); color:var(--bad); } .pill.run { background:var(--info-bg); color:var(--accent); }
  .section { margin-top:24px; }
  .label { font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .prose { max-width:62ch; }
  .clamp { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; } .clamp.open { -webkit-line-clamp:unset; }
  .clamp.open + .morebtn { display:none; }
  .morebtn { border:0; background:none; padding:0; color:var(--accent); cursor:pointer; font-size:13px; }
  .verdict { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-top:18px; }
  .verdict .num { font-size:22px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1; }
  .verdict .of { color:var(--faint); font-size:13px; margin-right:6px; }
  .chip { font-size:13px; padding:2px 10px; border-radius:99px; background:var(--hover); color:var(--sub); white-space:nowrap; }
  .chip.yes { background:var(--good-bg); color:var(--good); } .chip.no { background:var(--bad-bg); color:var(--bad); }
  .risks { color:var(--sub); max-width:62ch; } .risks li { margin:2px 0; }
  .inline { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; color:var(--sub); }

  /* decision */
  .gate { margin-top:28px; padding-top:20px; border-top:1px solid var(--line); }
  .gate.first { margin-top:20px; padding-top:0; border-top:0; }
  .gate > .actions { position:sticky; bottom:0; background:var(--bg); padding:12px 0; margin-top:4px; }
  .gate > .actions.hold { pointer-events:none; opacity:.6; }
  .gate h3 { font-size:15px; font-weight:600; }
  .hint { color:var(--sub); font-size:13px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
  .btn { border:1px solid var(--line); background:var(--bg); border-radius:7px; padding:6px 14px; cursor:pointer; font-weight:500; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; min-height:34px; }
  a.btn:not(.primary) { color:var(--text); }
  .btn:hover { background:var(--hover); text-decoration:none; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .btn.primary:hover { filter:brightness(1.08); }
  .btn.quiet { border-color:transparent; background:none; color:var(--sub); }
  .btn.danger:hover { color:var(--bad); background:var(--bad-bg); }
  .btn.sm { padding:3px 10px; min-height:28px; font-size:13px; }
  .btn[disabled] { opacity:.5; cursor:default; }
  textarea, input[type=text] { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:9px 11px; resize:vertical; }
  select { background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:7px 10px; max-width:100%; }
  fieldset { border:1px solid var(--line); border-radius:7px; margin:14px 0 0; padding:10px 12px; }
  legend { color:var(--sub); font-weight:600; }
  .question-group { border-top:1px solid var(--line); padding-top:20px; margin-top:24px; }
  .question-group h2 { font-size:17px; line-height:1.4; white-space:pre-wrap; overflow-wrap:anywhere; }
  .question-group label { display:block; margin-top:8px; }
  .question-group select { display:block; width:100%; margin-top:6px; }
  .gate[data-submission-ambiguous] > .actions, .gate[data-manual-handoff] > .actions { position:static; flex-wrap:wrap; padding:12px 0; border-top:0; }
  textarea:focus, input:focus, :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .row:focus-visible, .tab:focus-visible { outline-offset:-2px; }
  .said { white-space:pre-wrap; overflow-wrap:anywhere; margin-top:8px; max-width:62ch; }
  img.shot { display:block; width:100%; max-width:560px; border:1px solid var(--line); border-radius:7px; margin-top:14px; }
  img.page { max-width:100%; background:#fff; }
  @media (prefers-color-scheme: dark) { img.shot { filter:brightness(.86); } }
  .reveal { display:none; margin-top:12px; } .reveal.open { display:block; }
  .kv { display:grid; grid-template-columns:minmax(110px, 190px) minmax(0, 1fr); gap:6px 16px; } .kv dt { color:var(--sub); } .kv dd { overflow-wrap:anywhere; white-space:pre-wrap; } .kv dd.full { grid-column:1 / -1; }

  /* tabs + detail content */
  .tabs { display:flex; gap:2px; box-shadow:inset 0 -1px var(--line); margin-top:18px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; border:0; background:none; padding:8px 12px; cursor:pointer; color:var(--sub); border-bottom:2px solid transparent; white-space:nowrap; }
  .tab:hover { color:var(--text); }
  .tab.on { color:var(--text); border-color:var(--text); font-weight:600; }
  .chk { display:grid; grid-template-columns:18px minmax(0, 1fr) auto; gap:2px 10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .chk .mark { font-weight:700; } .chk .yes { color:var(--good); } .chk .no { color:var(--bad); } .chk .unclear { color:var(--faint); }
  .chk .why { grid-column:2 / 4; color:var(--sub); font-size:13px; overflow-wrap:anywhere; }
  .chk .pts { color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  pre { margin:0; font:12.5px/1.6 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; }
  .add { color:var(--good); } .del { color:var(--bad); } .hunk { color:var(--faint); }
  details > summary { cursor:pointer; color:var(--sub); } details[open] > summary { margin-bottom:10px; }
  .ev { display:grid; grid-template-columns:64px minmax(0, 1fr); gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .ev time { color:var(--faint); font-variant-numeric:tabular-nums; }
  .ev .who { color:var(--text); font-weight:600; }
  .ev .msg { color:var(--sub); overflow-wrap:anywhere; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; cursor:pointer; }
  .ev .msg.open { -webkit-line-clamp:unset; }
  .ev.k-error .msg { color:var(--bad); }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); border:1px solid var(--line); border-radius:8px; }
  .stat { padding:12px 14px; border-left:1px solid var(--line); } .stat:first-child { border-left:0; }
  .stat b { display:block; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; } .stat span { color:var(--sub); font-size:12px; }
  .notice { margin:0 0 16px; padding:10px 14px; border-radius:8px; background:var(--warn-bg); color:var(--warn); font-size:13px; }
  #ptext { font:13px/1.55 var(--mono); height:62vh; margin-top:14px; }
  .md { margin-top:6px; max-width:68ch; overflow-wrap:anywhere; }
  .md h1 { font-size:20px; letter-spacing:-.02em; margin:18px 0 6px; } .doc .md h2 { font-size:16px; margin:26px 0 4px; padding-bottom:4px; border-bottom:1px solid var(--line); letter-spacing:0; line-height:1.4; }
  .md h3, .md h4, .md h5, .md h6 { font-size:14px; margin:16px 0 2px; }
  .md p { margin:4px 0 8px; color:var(--sub); } .md ul, .md ol { margin:4px 0 8px; padding-left:22px; color:var(--sub); } .md li { margin:2px 0; }
  .md b { color:var(--text); } .md code { background:var(--hover); border-radius:4px; padding:1px 4px; } .md pre { background:var(--hover); border-radius:7px; padding:10px 12px; margin:8px 0; }
  .md blockquote { margin:8px 0; padding-left:12px; border-left:3px solid var(--line); color:var(--sub); } .md hr { border:0; border-top:1px solid var(--line); margin:16px 0; } .md a { color:var(--accent); }
  .savebar { position:sticky; bottom:0; background:var(--bg); padding:10px 0; margin-top:0; }
  .morelist .nav { padding:14px 16px; border-bottom:1px solid var(--line); border-radius:0; color:var(--text); justify-content:space-between; font-size:15px; min-height:52px; flex:none; width:100%; }
  .morelist .nav span { color:var(--faint); }
  .desc { font:inherit; max-width:72ch; }
  .keys { display:grid; grid-template-columns:auto auto; justify-content:start; gap:6px 12px; } kbd { font:11px var(--mono); border:1px solid var(--line); border-radius:4px; padding:1px 5px; background:var(--bg); color:var(--sub); }
  #offline { position:fixed; top:0; left:0; right:0; z-index:10; padding:6px 16px; text-align:center; font-size:13px; font-weight:600; background:var(--bad-bg); color:var(--bad); }
  #offline[hidden] { display:none; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9; max-width:90vw; display:flex; gap:14px; align-items:center; }
  #toast.on { opacity:1; pointer-events:auto; }
  #toast button { border:0; background:none; color:inherit; font-weight:700; text-decoration:underline; cursor:pointer; padding:0; }

  @media (min-width: 861px) and (max-width: 1180px) {
    #app { grid-template-columns:176px minmax(240px, 300px) minmax(0, 1fr); } #app.wide { grid-template-columns:176px minmax(0, 1fr); }
    .doc { padding:22px 24px 80px; } .sidefoot { white-space:normal; } .keys { grid-template-columns:auto; } .head, .search, .filters, .group, .row, .fold { padding-left:14px; padding-right:14px; }
  }
  @media (max-width: 860px) {
    #app, #app.wide { display:block; height:auto; }
    #side { flex-direction:row; align-items:stretch; gap:2px; padding:6px 8px; border-right:0; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; overflow:visible; }
    .brand, .navgroup, .sidefoot, .nav.d-only { display:none; }
    .nav, .nav.m-only { display:flex; flex:1 1 auto; justify-content:center; padding:8px 6px; min-height:42px; font-size:13px; gap:5px; white-space:nowrap; }
    .nav .n { margin-left:0; } .nav .n:not(.hot) { display:none; }
    #app.detail #side { display:none; }
    #list, #pane { overflow:visible; border:0; }
    #list .head { display:none; }
    #app.detail #list, #app:not(.detail):not(.wide) #pane { display:none; }
    .doc { padding:14px 16px calc(96px + env(safe-area-inset-bottom)); }
    .doc h2 { font-size:21px; }
    .btn.back { display:inline-flex; margin:0 0 8px -10px; }
    .filters { padding:10px 16px 4px; flex-wrap:nowrap; overflow-x:auto; } .fchip { padding:7px 14px; }
    .row { padding:11px 16px; } .group, .fold { padding-left:16px; padding-right:16px; } .fold { padding-top:9px; padding-bottom:13px; }
    textarea, input[type=text] { font-size:16px; }
    .btn, .btn.sm { min-height:42px; }
    .gate > .actions { position:fixed; left:0; right:0; bottom:0; margin:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); flex-wrap:nowrap; z-index:4; }
    .gate > .actions .btn { flex:1; padding-left:8px; padding-right:8px; } .gate > .actions .btn.quiet { flex:0 1 auto; }
    .tab { flex:none; padding:10px 0; margin-right:22px; }
    .chk { grid-template-columns:18px minmax(0, 1fr); } .chk .pts { grid-column:2; } .chk .why { grid-column:2; }
    .page .actions .btn { flex:1; }
    .kv { grid-template-columns:1fr; gap:0; } .kv dd { margin-bottom:10px; }
    .stats { grid-template-columns:repeat(2, 1fr); } .stat:nth-child(3) { border-left:0; } .stat:nth-child(n+3) { border-top:1px solid var(--line); }
    #toast { bottom:calc(76px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="app">
  <nav id="side" aria-label="Sections"></nav>
  <section id="list" aria-label="Jobs"></section>
  <main id="pane"></main>
</div>
<div id="offline" role="alert" hidden>Connection lost. What you see may be out of date. Reconnecting…</div>
<div id="toast" role="status"></div>

<script>
// An application under way that cannot continue without the user. Shown first in "In progress", with a marker.
const STUCK = ["awaiting_submit", "needs_input", "needs_manual", "failed"];
const VIEWS = {
  review:   { label: "To review",   group: "Applications", primary: true, statuses: ["awaiting_approval"], empty: "Nothing to review." },
  progress: { label: "In progress", primary: true, statuses: [...STUCK, "filling", "approved", "prepping", "locating", "triaged"], empty: "Nothing is being worked on." },
  questions: { label: "Questions", primary: true },
  applied:  { label: "Applied",     primary: true, statuses: ["offer", "interview", "submitted", "rejected_by_company"], empty: "No applications sent yet." },
  held:     { label: "Held",        statuses: ["held"], empty: "No jobs are being held back." },
  rejected: { label: "Rejected",    statuses: ["rejected"], empty: "You haven't rejected anything." },
  activity: { label: "Activity",    group: "System" },
  profile:  { label: "Profile" },
  settings: { label: "Settings" },
  more:     { label: "More", hidden: true },
};
const STATUS = {
  awaiting_approval: ["need", "Review"], needs_input: ["need", "Question"], awaiting_submit: ["need", "Confirm submit"], needs_manual: ["need", "Needs your help"],
  failed: ["bad", "Failed"], triaged: ["idle", "Not assessed yet"], locating: ["run", "Finding the posting"], prepping: ["run", "Assessing"], approved: ["run", "Queued to apply"], filling: ["run", "Applying"],
  submitted: ["ok", "Submitted"], interview: ["ok", "Interview"], offer: ["ok", "Offer"], rejected_by_company: ["bad", "Declined"],
  rejected: ["idle", "Rejected"], skipped: ["idle", "Skipped"], held: ["idle", "Held"],
};
const SENT = ["submitted", "interview", "offer"];
const NOISE = /compil|pdfinfo|typst|page count|one page|metadata/i; // build chatter that older assessments wrote into "concerns"

// Quick filters per section: [key, label, test]. The first entry of each is "All".
const remote = j => /remote|anywhere/i.test(j.location ?? ""), is = (...st) => j => st.includes(j.status);
const high = ["top", "80+", j => j.score >= 80], isRemote = ["remote", "Remote", remote];

  held:     [["all", "All"], high, near, isRemote],

  activity: [["all", "All"], ["gate", "Needs you", e => e.kind === "gate"], ["user", "You", e => e.kind === "user"], ["error", "Errors", e => e.kind === "error"], ["system", "Scans", e => e.kind === "system"]],

let S = null, view = "review", selected = null, shownSel = null, D = null, tab = "summary", profileFile = null, feedAll = false;
let digestBusy = false, digestResult = "";
const $ = (sel, el = document) => el.querySelector(sel);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const when = iso => { if (!iso) return ""; const m = (Date.now() - Date.parse(iso.includes("T") ? iso : iso.replace(" ", "T") + "Z")) / 60000; return m < 1 ? "just now" : m < 60 ? `${m | 0}m ago` : m < 1440 ? `${m / 60 | 0}h ago` : `${m / 1440 | 0}d ago`; };

const PLAIN = { parts: [[""]], of: () => 0, key: j => j.score ?? -1 };

// A view's jobs, in parts; inside a part an employer's roles sit together, best first, and a long run folds.

// ---------------------------------------------------------------- routing: #view or #view/jobId

const itemLabel = i => esc(cap(i.label ?? i.key.split(".")[1].replace(/_/g, " ")));

function verdictHtml(j) {
  const items = checklist(j).filter(i => i.phase === S.phase);

  const scored = items.filter(i => !i.required).sort((a, b) => b.weight - a.weight);
  const misses = [...items.filter(i => i.required && i.answer === "no"), ...scored.filter(i => i.answer === "no")];
  const hits = scored.filter(i => i.answer === "yes");
  const show = [...misses.map(i => `<span class="chip no">✗ ${itemLabel(i)}</span>`), ...hits.map(i => `<span class="chip yes">✓ ${itemLabel(i)}</span>`)];

// "Label: value" lines from the agent become a definition list; anything else stays as text.
// A summary written as one paragraph is taken a sentence at a time instead, so each answer gets its own row.
function entered(text) {
  text = text.replace(/\/\S*\/data\/jobs\/\S*\/([^\/\s]+)/g, "$1"); // the frozen resume's path on disk: the file name is enough
  let lines = text.split("\n").filter(l => l.trim());

  if (prose) lines = text.split(/(?<=[^A-Z.]\.)\s+(?=[A-Z"])/).filter(l => l.trim()).map(l => l.replace(/\.$/, ""));
  const rows = [];
  for (const line of lines) {
    const m = line.match(/^([^:]{2,60}):\s+(.*)$/s);
    if (m) rows.push([m[1], m[2]]); else if (rows.length && !prose) rows[rows.length - 1][1] += "\n" + line; else rows.push(["", line]);
  }
  return rows.length < 3 ? `<p class="said">${linkify(esc(text))}</p>` : `<dl class="kv" style="margin-top:12px">${rows.map(([k, v]) => k ? `<dt>${esc(k)}</dt><dd>${linkify(esc(v.trim()))}</dd>` : `<dd class="full">${linkify(esc(v.trim()))}</dd>`).join("")}</dl>`;
}

function gateHtml(j) {

  const live = j.vncUrl ? `<a class="btn" data-browser-lease href="${esc(j.vncUrl)}" target="_blank" rel="noopener">Inspect reserved browser</a>` : "";
  const gateId = p?.id ?? parsePending(j.pending)?.gateId;

    ? `${live}<button class="btn" data-browser-action="release" data-gate-id="${esc(gateId)}">Release browser</button>`

      ${saved}
      <div class="actions"><button class="btn quiet danger" data-act="reject">Reject application</button></div></div>`;
  }
  if (j.submissionAmbiguous && !["submitted", "interview", "offer", "rejected_by_company", "rejected"].includes(j.status)) {
    const pend = parsePending(j.pending);
    const gateId = p?.id ?? pend?.gateId;
    const context = (p?.context || pend?.context || "").trim();
    const reason = (context && context !== p?.text) ? context : (p?.text ?? j.note ?? "");
    const recoverBtn = gateId ? `<button class="btn" data-act="recover" data-gate-id="${esc(gateId)}">Check status & recover</button>` : "";
    return `<div class="gate ${first}" data-submission-ambiguous ${gateId ? `data-gate-id="${esc(gateId)}"` : ""}><h3>Submission outcome is unknown</h3>
      <p class="hint">${j.manualBrowserReserved ? "You reserved this browser for inspection. Release browser when finished so other applications can use the slot." : "This blocker releases its slot after the worker exits. Reserve the browser only when you need to inspect it."} The saved draft, checkpoint, and submission protection remain intact.</p>
      <p class="hint">The final submit may already have happened. Inspect the existing application/account and confirmation mail before deciding. Ordinary retry and response are disabled; never create another application to check.</p>
      <p class="said">${esc(reason)}</p>${shot}${saved}
      <p class="hint" style="margin-top:12px">The agent signs in with saved credentials and checks exact application/mail; no new submit while status unknown.</p>
      <div class="actions">${recoverBtn}${browserAction}<button class="btn" data-act="mark_submitted">Verified submitted</button><button class="btn" data-act="confirmed_not_submitted">Verified not submitted · queue</button>${reject}</div></div>`;
  }
  if (j.status === "awaiting_approval") return `<div class="gate"><h3>Apply to this job?</h3>
      <p class="hint">${S.confirmBeforeSubmit ? "The agent fills in the form and stops for your OK before it submits." : "The agent fills in the form and submits it."}</p>
      <div class="actions"><button class="btn primary" data-act="approve" title="Approve (A)">Approve</button><button class="btn" data-toggle="#redo">Change resume</button>${reject}</div>
      <div class="reveal" id="redo"><textarea id="fb" rows="3" placeholder="What should change in the resume?"></textarea><div class="actions"><button class="btn" data-act="redo" data-text="#fb">Redo with this note</button></div></div></div>`;
  if (p?.kind === "question") return `<div class="gate ${first}" data-gate-id="${esc(p.id)}"><h3>The agent needs an answer</h3><p class="said">${esc(p.text)}</p>${questionDetailsHtml(p)}${shot}${saved}
      <label for="ans" class="hint" style="display:block;margin-top:12px">Your answer · this application only</label><textarea id="ans" rows="3" required></textarea><p class="hint" style="margin-top:6px">Stored durably for this application, never added to your global answer bank. For explicitly scoped standing reuse, use <a href="#questions">Questions</a>.</p>
      <div class="actions"><button class="btn primary" data-act="respond" data-text="#ans">Save answer and queue</button>${reject}</div></div>`;
  if (p?.kind === "cover_letter") return `<div class="gate ${first}" data-gate-id="${esc(p.id)}"><h3>This application requires a cover letter</h3><p class="said">${esc(p.text)}</p>${questionDetailsHtml(p)}${shot}${saved}
      <label for="ans" class="hint" style="display:block;margin-top:12px">Cover letter · this application only</label><textarea id="ans" rows="12" required></textarea><p class="hint" style="margin-top:6px">Entered exactly as you write it, for this job only.</p>
      <div class="actions"><button class="btn primary" data-act="respond" data-text="#ans">Save letter and queue</button>${reject}</div></div>`;
  if (p?.kind === "confirm_submit") return `<div class="gate ${first}" data-gate-id="${esc(p.id)}"><h3>Submit this application?</h3><p class="hint">Approval applies only to this application's exact saved summary. The worker resumes and verifies it before submitting.</p>
      ${entered(p.text)}${shot}${saved}
      <div class="actions"><button class="btn primary" data-act="respond" data-fixed="approve">Approve submission</button><button class="btn" data-toggle="#chgbox">Change something</button>${reject}</div>
      <div class="reveal" id="chgbox"><label for="chg">Changes for this application</label><textarea id="chg" rows="3" placeholder="What should the agent change first?"></textarea><div class="actions"><button class="btn" data-act="respond" data-text="#chg">Save changes and queue</button></div></div></div>`;
  if (p?.kind === "manual") return `<div class="gate ${first}" data-gate-id="${esc(p.id)}" data-manual-handoff><h3>The agent needs browser help</h3><p class="said">${esc(p.text)}</p>${questionDetailsHtml(p)}${shot}${saved}
      <p class="hint" style="margin-top:12px">${j.manualBrowserReserved ? "You reserved this browser for inspection. Release browser when finished so other applications can use the slot." : "This blocker releases its slot after the worker exits. Reserve the browser before inspecting or changing it."} The saved draft and checkpoint remain intact.</p>
      <p class="hint" style="margin-top:12px">Resumes the authorized application after checking its current state; existing drafts are reused and submission approval rules still apply.</p>
      <div class="actions"><button class="btn" data-act="recover" data-gate-id="${esc(p.id)}">Check status & recover</button>${browserAction}${j.manualBrowserReserved ? `<button class="btn primary" data-act="respond" data-fixed="done">Hand control back</button>` : ""}<button class="btn" data-act="mark_submitted">I submitted it</button>${reject}</div></div>`;
  if (j.status === "failed") return `<div class="gate ${first}"><h3>This application failed</h3><p class="said" style="color:var(--sub)">${esc(cap(j.note ?? "No reason was recorded."))}</p>
      <div class="actions"><button class="btn primary" data-act="retry">Retry</button>${live}<button class="btn" data-act="mark_submitted">Mark submitted</button>${reject}</div></div>`;
  if (j.status === "held") return `<div class="gate ${first}"><h3>Held for later</h3><p class="hint">${esc(cap(j.note ?? ""))}</p>
      <div class="actions"><button class="btn" data-act="retry">Assess now</button>${reject}</div></div>`;
  if (j.status === "rejected") return `<div class="gate ${first}">${j.submissionAmbiguous ? `<p class="hint">Rejected with an unresolved submission marker. Reconsidering is disabled to prevent a duplicate application.</p>` : `<div class="actions" style="margin-top:0"><button class="btn" data-act="retry">Reconsider</button></div>`}</div>`;
  if (["approved", "filling", "triaged", "prepping", "locating"].includes(j.status)) {
    const last = j.events.find(e => e.kind === "step");
    return `<div class="gate ${first}"><h3>${STATUS[j.status][1]}</h3><p class="hint">${checkpoint && ["approved", "filling"].includes(j.status) ? j.status === "approved" ? "Queued to resume the authorized application when a worker is available." : "Resuming the authorized application with its saved answers and frozen resume." : last ? esc(last.message) : "Waiting for a free worker."}</p>${j.note ? `<p class="hint">Prior run note</p><p class="said" style="color:var(--sub)">${esc(j.note)}</p>` : ""}${saved}<div class="actions"><button class="btn" data-act="reject">Stop</button></div></div>`;
  }
  return "";
}

function parsePractice(raw) {
  if (!raw) return null;
  let obj = null;
  if (typeof raw === "string") {
    const t = raw.trim();
    if (!t) return null;
    try { obj = JSON.parse(t); } catch { return null; }
  } else if (typeof raw === "object") {
    obj = raw;
  } else {
    return null;
  }
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) return null;
  if (obj.version !== 1) return null;

  const rawSalary = obj.annualBaseMaxUsd;
  let salary = null;
  if (rawSalary === null) {
    salary = null;
  } else if (typeof rawSalary === "number") {
    if (!Number.isFinite(rawSalary) || rawSalary <= 0) return null;
    salary = rawSalary;
  } else {
    return null;
  }

  if (typeof obj.salaryEvidence !== "string") return null;
  const sEv = obj.salaryEvidence.trim();
  if (salary !== null && sEv.length === 0) return null;

  const rawLoc = obj.mandatoryNonlocalOnsite;
  if (rawLoc !== "yes" && rawLoc !== "no" && rawLoc !== "unclear") return null;

  if (typeof obj.locationEvidence !== "string") return null;
  const lEv = obj.locationEvidence.trim();
  if (rawLoc === "yes" && lEv.length === 0) return null;

  return {
    version: 1,
    annualBaseMaxUsd: salary,
    salaryEvidence: sEv,
    mandatoryNonlocalOnsite: rawLoc,
    locationEvidence: lEv,
  };
}

function practiceEvidenceHtml(j) {
  if (S.phase !== "practice" && !j.practice_assessment) return "";
  const pa = parsePractice(j.practice_assessment);
  if (!pa) {
    return `<div class="section practice-evidence"><div class="label">Practice eligibility · <span class="pill bad">Missing/Invalid assessment</span></div><p class="prose hint" style="margin-top:6px">No valid version 1 practice assessment recorded. Fails closed (requires explicit evidence of salary ceiling &le; $80k or mandatory nonlocal attendance).</p></div>`;
  }
  const qualSalary = pa.annualBaseMaxUsd !== null && pa.annualBaseMaxUsd <= 80000;
  const qualLoc = pa.mandatoryNonlocalOnsite === "yes";
  const qual = qualSalary || qualLoc;

  const salaryDisplay = pa.annualBaseMaxUsd != null
    ? `$${Number(pa.annualBaseMaxUsd).toLocaleString()}/yr ceiling`
    : "No qualifying ceiling stated";
  const locDisplay = pa.mandatoryNonlocalOnsite === "yes"
    ? "Mandatory nonlocal onsite/hybrid"
    : pa.mandatoryNonlocalOnsite === "no"
      ? "Remote or local to Houston area"
      : "Unclear attendance policy";

  const reasons = [];
  if (qualSalary) reasons.push(`Salary <= $80k ($${Number(pa.annualBaseMaxUsd).toLocaleString()})`);
  if (qualLoc) reasons.push("Mandatory nonlocal attendance");
  const badgeCls = qual ? "ok" : "bad";
  const badgeText = qual ? `Eligible (${reasons.join(", ")})` : "Not eligible (no qualifying positive evidence)";

  return `<div class="section practice-evidence"><div class="label">Practice eligibility · <span class="pill ${badgeCls}">${esc(badgeText)}</span></div>
    <dl class="kv" style="margin-top:8px">
      <dt>Salary ceiling</dt>
      <dd><span>${esc(salaryDisplay)}</span>${pa.salaryEvidence ? `<div class="hint" style="margin-top:2px">${esc(pa.salaryEvidence)}</div>` : ""}</dd>
      <dt>Attendance</dt>
      <dd><span>${esc(locDisplay)}</span>${pa.locationEvidence ? `<div class="hint" style="margin-top:2px">${esc(pa.locationEvidence)}</div>` : ""}</dd>
    </dl></div>`;
}


function summaryHtml(j) {
  const risks = (j.concerns ?? "").split(/\n|(?<=\.)\s+(?=[A-Z])/).map(s => s.replace(/^[-•\s]+/, "").trim()).filter(s => s && !NOISE.test(s)).slice(0, 3);
  const changes = (j.resume_changes ?? "").split("\n").filter(l => l.trim() && !NOISE.test(l)).length;
  const resumeNote = j.resumeFrozen ? (j.submitted_at ? "as submitted" : "locked for this application") : changes ? `${changes} change${changes > 1 ? "s" : ""} from your base resume` : "";
  const outcome = (SENT.includes(j.status) || j.status === "rejected_by_company") && j.note ? `<div class="section"><p class="prose">${esc(j.note)}</p></div>` : "";
  const fit = `${verdictHtml(j)}
    ${j.rationale ? `<p class="prose clamp" style="margin-top:12px">${esc(j.rationale)}</p>${j.rationale.length > 190 ? `<button class="morebtn" data-more="1">More</button>` : ""}` : ""}
    ${practiceEvidenceHtml(j)}
    ${risks.length ? `<div class="section"><div class="label">Watch out</div><ul class="risks">${risks.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>` : ""}
    ${j.hasPdf ? `<div class="section inline"><a href="/api/jobs/${j.id}/resume.pdf" target="_blank" rel="noopener">Open resume ↗</a>${resumeNote ? `<span>${resumeNote}</span>` : ""}</div>` : ""}`;
  const gate = gateHtml(j);
  // Approving is a judgement on the fit, so the fit comes first. Every other decision is about what
  // the agent just did, so that comes first and the fit folds away.
  if (j.status === "awaiting_approval" || !gate) return outcome + fit + gate;
  const folded = j.score == null ? "" : `<div class="section"><details><summary>Fit ${j.score}${risks.length ? ` · ${risks.length} thing${risks.length > 1 ? "s" : ""} to watch` : ""}</summary>${fit}</details></div>`;
  return gate + folded;
}

function scoreHtml(j) {
  const items = checklist(j), mark = { yes: "✓", no: "✗", unclear: "?" };
  const practiceBlock = practiceEvidenceHtml(j);
  if (!items.length && !practiceBlock) return `<div class="empty">Not scored yet.</div>`;
  const block = phase => {
    const rows = items.filter(i => i.phase === phase);
    if (!rows.length) return "";
    const possible = rows.reduce((n, i) => n + Math.max(0, i.weight), 0), earned = rows.reduce((n, i) => n + i.points, 0);
    const met = rows.filter(i => i.required && i.answer !== "no"), shown = rows.filter(i => !met.includes(i));
    return `<div class="section"><div class="label">${phase} · ${earned} / ${possible}</div>` +
      (met.length ? `<div class="chk"><span class="mark yes">✓</span><span>${met.length} requirement${met.length > 1 ? "s" : ""} met <span style="color:var(--sub)">(${met.map(itemLabel).join(", ")})</span></span></div>` : "") +
      shown.map(i => `<div class="chk"><span class="mark ${i.answer}">${mark[i.answer]}</span><span>${esc(i.statement)}</span><span class="pts">${i.required ? "required" : `${i.points} / ${i.weight}`}</span>${i.evidence ? `<span class="why">${esc(i.evidence)}</span>` : ""}</div>`).join("") + `</div>`;
  };
  return practiceBlock + block(S.phase) + (S.phase === "practice" ? block("real") : "");
}

// Turn raw log entries into plain sentences for the feed; null drops the entry.
function plain(e) {
  const m = e.message.replace(/\bTab job-\d+:\s*/g, ""), cut = s => s.replace(/^\w+:\s*/, "");
  if (/^Chrome started|^Gmail connected/.test(m)) return null;
  if (e.kind === "gate") return m.startsWith("question") ? `Asked you: ${cut(m)}` : m.startsWith("cover_letter") ? "Asked you for a cover letter." : m.startsWith("confirm_submit") ? "Filled in the form and is waiting for you to confirm." : `Got stuck: ${cut(m)}`;
  if (e.kind === "user") { const [act, ...rest] = m.split(": "); const note = rest.join(": "); return ({ approve: "You approved it.", reject: "You rejected it.", retry: "You sent it back to the queue.", redo: `You asked for changes: ${note}`, mark_submitted: "You marked it as submitted.", respond: note === "approve" ? "You confirmed the submit." : `You replied: ${note}` })[act] ?? cap(m); }
  return m;
}
// Collapse a run of triage batches into one line.
function feed() {
  const out = [];
  for (const e of S.highlights) {
    const t = e.message.match(/^Triage: kept (\d+), held (\d+) of (\d+)/), prev = out[out.length - 1];
    if (t && prev?.triage) { prev.triage = prev.triage.map((n, i) => n + +t[i + 1]); continue; }
    const text = t ? "" : plain(e);
    if (text === null) continue;
    out.push({ ...e, text, triage: t ? [+t[1], +t[2], +t[3]] : null });
  }
  return out.map(e => ({ ...e, text: e.triage ? `Checked ${e.triage[2]} new postings: kept ${e.triage[0]}${e.triage[1] ? `, held ${e.triage[1]}` : ""}.` : e.text }));
}

// Markdown, as far as the profile files use it: headings, nested lists, quotes, code, rules, bold, italic, links.
const mdInline = s => esc(s).split(/(`[^`]+`)/).map(p => p[0] === "`" && p.length > 2 ? `<code>${p.slice(1, -1)}</code>`
  : p.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')).join("");
function md(text) {
  let out = "", para = [], lists = []; // lists: open <ul>/<ol> as [indent, tag]
  const flush = () => { if (para.length) out += `<p>${para.map(mdInline).join("<br>")}</p>`; para = []; };
  const close = (to = -1) => { while (lists.length && lists.at(-1)[0] > to) out += `</li></${lists.pop()[1]}>`; };
  const lines = text.replace(/\r/g, "").split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i], item = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/), head = line.match(/^(#{1,6})\s+(.*)$/);
    if (/^\s*```/.test(line)) {
      flush(); close();
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
      out += `<pre>${esc(code.join("\n"))}</pre>`;
    } else if (head) { flush(); close(); out += `<h${head[1].length}>${mdInline(head[2])}</h${head[1].length}>`; }
    else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); close(); out += "<hr>"; }
    else if (item) {
      flush();
      const indent = item[1].length, tag = /\d/.test(item[2]) ? "ol" : "ul";
      close(indent);
      if (lists.length && lists.at(-1)[0] === indent) out += "</li><li>";
      else { lists.push([indent, tag]); out += `<${tag}><li>`; }
      out += mdInline(item[3]);
    }
    else if (!line.trim()) { flush(); if (!/^\s/.test(lines[i + 1] ?? "") || !lists.length) close(); }
    else if (lists.length && /^\s/.test(line)) out += (para.length ? "" : "<br>") + mdInline(line.trim());
    else if (/^>\s?/.test(line)) { flush(); close(); out += `<blockquote>${mdInline(line.replace(/^>\s?/, ""))}</blockquote>`; }
    else { close(); para.push(line); }
  }
  flush(); close();
  return out;
}

let profileRaw = false; // markdown files open rendered; this switches to the editable source
let profileDirty = false; // the editor holds changes that have not been saved
const PROFILE_LABEL = { "targets.md": "Targets", "rubric.yml": "Rubric", "main.typ": "Resume", "resume-notes.md": "Resume notes", "answers.md": "Answers", "personal.yml": "Personal", "companies.yml": "Companies" };
const keepEdits = () => profileDirty && !confirm(`Discard your unsaved changes to ${profileFile}?`);
async function saveProfile() {
  const res = await fetch(`/api/profile/${profileFile}`, { method: "PUT", body: $("#ptext").value }).catch(() => null);
  if (!res?.ok) return toast(`Could not save ${profileFile}. Your changes are still in the editor.`);
  profileDirty = false; document.activeElement?.blur(); profileRaw = false; cache.delete($("#pane")); toast(`Saved ${profileFile}`); refresh();
}
async function profileView() {
  profileFile ??= S.profileFiles[0];
  const isMd = profileFile.endsWith(".md"), raw = profileRaw || !isMd;
  // The editor is painted once and left alone while it is open; the rendered view follows the file.
  if (raw && cache.get($("#pane")) === "profile:" + profileFile) return;
  const file = profileFile, text = await api(`/api/profile/${file}`);
  if (file !== profileFile || view !== "profile") return;
  const key = raw ? "profile:" + file : `profile:${file}:${text}`;
  if (cache.get($("#pane")) === key) return;
  cache.set($("#pane"), key);
  $("#pane").innerHTML = `<div class="doc page">${title("Profile")}${notices()}
    <div class="tabs scrollx" style="margin-top:0">${S.profileFiles.map(f => `<button class="tab ${f === file ? "on" : ""}" data-pfile="${f}" title="${f}">${PROFILE_LABEL[f] ?? f}</button>`).join("")}</div>
    ${raw ? `<textarea id="ptext" spellcheck="false">${esc(text)}</textarea>
    <div class="actions savebar"><button class="btn primary" id="psave" title="Save (Ctrl+S)">Save</button>${isMd ? `<button class="btn" id="pmode">Cancel</button>` : ""}</div>`
      : `<div class="actions" style="margin-top:14px"><button class="btn sm" id="pmode">Edit</button><span class="hint">${file}</span></div><div class="md">${md(text)}</div>`}</div>`;
}

function autoHtml() {
  const a = S.autoApply ?? {};
  if (!a.enabled) return "Off. Every application waits for your approval in To review.";
  if (!a.phases?.includes(S.phase)) return `Off in the ${S.phase} phase (on for ${a.phases?.join(", ") || "none"}).`;
  const submit = a.submit ? "They are also submitted without your confirmation." : "They still stop for your OK before submitting.";
  return `On. Jobs scoring ${a.minScore} or more with verified positive practice evidence${a.allowConcerns ? "" : " with no concerns raised"} are approved for you, up to ${a.perDay} a day (${a.approvedToday ?? 0} so far today). ${submit}`;
}

function settingsHtml() {
  const held = S.counts.held ?? 0, browsers = S.browsers ?? [S.vncUrl].filter(Boolean);
  const a = S.autoApply ?? {};

  let nextDigest = "Disabled";
  if (digest.enabled) {
    const formatter = new Intl.DateTimeFormat("en-CA", { timeZone: digest.timeZone, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
    const clock = Object.fromEntries(formatter.formatToParts(new Date()).map(p => [p.type, p.value]));
    const today = `${clock.year}-${clock.month}-${clock.day}`, localTime = `${clock.hour}:${clock.minute}`;
    const last = digest.lastSentAt ? Object.fromEntries(formatter.formatToParts(new Date(digest.lastSentAt)).map(p => [p.type, p.value])) : null;
    const sentToday = last && `${last.year}-${last.month}-${last.day}` >= today;
    const tomorrow = new Date(Date.UTC(+clock.year, +clock.month - 1, +clock.day + 1)).toISOString().slice(0, 10);
    nextDigest = `${sentToday ? `${tomorrow} at ${digest.time}` : localTime >= digest.time ? `Due at the next scheduler tick (today's ${digest.time} window is open)` : `${today} at ${digest.time}`} · ${digest.timeZone}`;
  }
  const autoSubmits = a.enabled && a.submit && a.phases?.includes(S.phase);
  const confirmNote = (S.confirmBeforeSubmit
    ? "Manual approvals require your OK before submitting."
    : "Manually approved jobs submit without confirmation.") + (autoSubmits
    ? " Eligible auto-approved jobs submit directly."
    : " Auto-approved jobs still require your OK before submitting.");
  return `<div class="doc page">${title("Settings")}${notices()}
    <div class="section" style="margin-top:0"><div class="label">Mailbox</div>
      <dl class="kv"><dt>Status</dt><dd>${S.gmail.connected ? `Connected as ${esc(S.gmail.address)}` : `Not connected${S.mailbox ? `. Sign in as ${esc(S.mailbox)}` : ""}`}</dd><dt>OAuth redirect URI</dt><dd><code>${esc(S.redirectUri)}</code></dd></dl>
      <div class="actions"><a class="btn" href="/oauth/start">${S.gmail.connected ? "Reconnect Gmail" : "Connect Gmail"}</a></div></div>
    <div class="section" id="settings-digest"><div class="label">Daily questions digest</div>
      <dl class="kv">
        <dt>Enabled</dt><dd data-digest-enabled>${S.digest.enabled ? "Yes" : "No"}</dd>
        <dt>Next daily schedule</dt><dd data-digest-next>${esc(nextDigest)}; sends only previously undelivered groups.</dd>
        <dt>Recipient</dt><dd data-digest-recipient>${esc(S.digest.recipient ?? "No verified connected mailbox")}</dd>
        <dt>Delivery state</dt><dd data-digest-state>${esc(S.digest.deliveryState)}</dd>
        <dt>Undelivered groups</dt><dd data-digest-count>${S.digest.undeliveredGroups}</dd>
        <dt>Last successful send</dt><dd data-digest-last>${S.digest.lastSentAt ? `${esc(S.digest.lastSentAt)} (${esc(when(S.digest.lastSentAt))})` : "Never"}</dd>
        <dt>Last error</dt><dd data-digest-error ${S.digest.lastError ? 'role="alert"' : ""}>${esc(S.digest.lastError ?? "None")}</dd>
      </dl>
      <p class="hint" style="margin-top:12px">Configure <code>questionDigest.enabled</code>, <code>questionDigest.time</code> (HH:mm) and <code>questionDigest.timeZone</code> in <code>config.yml</code>. Delivery goes only to the verified configured/connected Gmail mailbox, never an arbitrary recipient. The message contains grouped prompts, counts and links, not answer values or credentials.</p>
      <p class="hint" style="margin-top:6px">Send now bypasses the daily schedule, not delivery deduplication. Adding another application to an unchanged notified group does not send it again. An uncertain send is reconciled with Sent mail before any retry.</p>
      <div class="actions"><button class="btn primary" id="digest-send" ${digestBusy || !S.digest.enabled || !S.digest.recipient ? "disabled" : ""}>${digestBusy ? "Sending / reconciling…" : "Send digest now"}</button><button class="btn" id="digest-refresh" ${digestBusy ? "disabled" : ""}>Refresh digest status</button></div>
      <p class="hint" id="digest-result" role="status">${esc(digestResult)}</p>
    </div>
    <div class="section"><div class="label">Add a posting</div><div class="actions" style="margin-top:0;flex-wrap:nowrap"><input type="text" id="addurl" placeholder="Paste a job URL" aria-label="Job URL" inputmode="url"><button class="btn" id="addbtn">Add</button></div></div>
    <div class="section"><div class="label">Phase</div><p class="prose">${cap(S.phase)}. Change it in <code>config.yml</code>. ${held ? `${held} held job${held === 1 ? "" : "s"} can go back through triage once you switch.` : "No jobs are held back."}</p>
      ${held ? `<div class="actions"><button class="btn" data-run="release_held">Release held jobs</button></div>` : ""}</div>
    <div class="section" id="settings-auto-apply"><div class="label">Auto apply</div>
      <p class="prose auto-status">${autoHtml()} Change it in <code>config.yml</code>.</p>
      <dl class="kv auto-settings" style="margin-top:12px">
        <dt>Practice gate</dt>
        <dd class="auto-gate">Positive evidence required: posted annual base salary ceiling &le; $80k USD or mandatory nonlocal onsite/hybrid (outside Austin / Houston with no remote/local option). Without either proven reason, jobs are held back to protect potentially wanted roles. Low real score or travel is not practice proof.</dd>
        <dt>Caps</dt>
        <dd class="auto-caps">${(a.perDay ?? 5)} auto-approvals/day (${(a.approvedToday ?? 0)} so far today); ${(S.applyPerDay ?? 15)} application attempts/day (blocked and failed starts count). Daily quotas reset at midnight UTC.</dd>
        <dt>Safeguards</dt>
        <dd class="auto-safeguards">Missing practice proof is held back (not spent); low fit or failed qualifications are skipped. Hand-picked postings${a.allowConcerns ? "" : " and jobs with concerns"} wait in To review.${a.allowConcerns ? " Concerns alone do not block a proven practice role." : ""} Invalid auto-approvals are held before fill. ${confirmNote}</dd>
      </dl>
    </div>
    <div class="section"><div class="label">Browser</div><p class="prose">${browsers.length > 1 ? `Up to ${browsers.length} browser slots run on this machine.` : "Chrome runs on this machine."} These are shared slot views, not application links. Ordinary parked applications release their slots; inspect their saved screenshot/checkpoint instead. Only explicitly reserved manual handoffs and ambiguous submissions expose a browser link on their application page. Do not take over a browser without checking its current application.</p>
      <div class="actions">${browsers.map((u, i) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">Open browser${browsers.length > 1 ? ` ${i + 1}` : ""}</a>`).join("")}</div></div>
  </div>`;
}

// ---------------------------------------------------------------- events
document.addEventListener("submit", async ev => {
  const form = ev.target.closest("[data-question-form]");
  if (!form) return;
  ev.preventDefault();
  if (form.dataset.sending) return;
  const gateId = form.elements.job.value, answer = form.elements.answer.value.trim(), scope = form.elements.scope.value;
  if (!answer) { form.elements.answer.focus(); return toast("Type an answer first."); }
  const group = S.questionGroups.find(g => g.jobs.some(j => j.gateId === gateId));
  if (!group) { document.activeElement?.blur(); await refresh(); return toast("This question has already changed. Reloaded the inbox."); }
  if (scope === "standing" && !confirm(`Approve a standing answer for ${group.scopeLabel}?\n\nThis requeues all ${group.jobs.length} matching open applications and allows future reuse only for this exact employer/prompt/context/options scope.`)) return;
  form.dataset.sending = "true";
  const controls = [...form.elements];
  controls.forEach(el => el.disabled = true);
  try {
    const result = await api(`/api/questions/${encodeURIComponent(gateId)}/answer`, { method: "POST", body: { answer, scope } });
    document.activeElement?.blur();
    toast(`Answer saved · queued applications: ${result.jobIds.map(id => `#${id}`).join(", ")}`);
    await refresh();
  } catch {
    await refresh().catch(() => {});
  } finally {
    delete form.dataset.sending;
    controls.forEach(el => el.disabled = false);
  }
});
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-view],[data-job],[data-act],[data-run],[data-pfile],[data-back],[data-tab],[data-toggle],[data-feed],[data-open],[data-filter],[data-clamp],[data-more],[data-fold],[data-browser-action],#psave,#pmode,#addbtn,#digest-send,#digest-refresh");
  if (!t) return;
  if (t.disabled) return;
  const d = t.dataset;
  if ((d.view || d.pfile || d.open || t.id === "pmode") && keepEdits()) return ev.preventDefault();
  if (d.view || d.pfile || d.open || t.id === "pmode") profileDirty = false;
  if (d.run === "release_held" && !confirm(`Send all ${S.counts.held ?? 0} held jobs back through triage? Each one is assessed again.`)) return;
  if (d.view) { go(d.view); scrollTo(0, 0); }
  else if (d.job) go(view, +d.job);
  else if (d.open) { ev.preventDefault(); const j = S.jobs.find(x => x.id === +d.open); go(Object.keys(VIEWS).find(k => VIEWS[k].statuses?.includes(j?.status)) ?? "review", +d.open); }
  else if (d.back) go(view);
  else if (d.tab) { tab = d.tab; render(); }
  else if (d.toggle) { const el = $(d.toggle); el.classList.toggle("open"); $("textarea", el)?.focus(); }
  else if (d.clamp) t.classList.toggle("open");
  else if (d.more) t.previousElementSibling.classList.add("open");
  else if (d.fold) { unfolded.has(d.fold) ? unfolded.delete(d.fold) : unfolded.add(d.fold); render(); }
  else if (d.filter) {
    filt[view] = d.filter;
    try { localStorage.setItem("filters", JSON.stringify(filt)); } catch {}
    // Keep the open job only if it is still in the list.
    if (VIEWS[view].statuses && !ordered().some(j => j.id === selected)) go(view, wide() ? ordered()[0]?.id ?? null : null, true); else render();
  }
  else if (d.feed) { feedAll = !feedAll; render(); }
  else if (d.pfile) { profileFile = d.pfile; profileRaw = false; document.activeElement?.blur(); render(); }
  else if (t.id === "pmode") { profileRaw = !profileRaw; document.activeElement?.blur(); cache.delete($("#pane")); render(); }
  else if (t.id === "psave") saveProfile();
  else if (t.id === "addbtn") { if (!$("#addurl").value.trim()) return $("#addurl").focus(); await api("/api/jobs", { method: "POST", body: { url: $("#addurl").value.trim() } }); $("#addurl").value = ""; toast("Added. It will be assessed shortly."); refresh(); }
  else if (t.id === "digest-send" || t.id === "digest-refresh") {
    if (digestBusy) return;
    digestBusy = true; render();
    try {
      if (t.id === "digest-send") {
        const result = await api("/api/digest/send", { method: "POST", body: {} });
        digestResult = result.sent ? `Sent ${result.groups} group${result.groups === 1 ? "" : "s"}${result.messageId ? ` · ${result.messageId}` : ""}` : `Not sent: ${result.reason ?? "No new undelivered groups"}`;
        toast(digestResult);
      }
    } catch (err) {
      digestResult = `Send failed: ${err.message}`;
    } finally {
      try { S.digest = await api("/api/digest/status"); } catch { digestResult = "Could not refresh digest status. Delivery outcome is unverified; check Gmail before retrying."; }
      digestBusy = false; render();
    }
  }
  else if (d.run) { await api("/api/run", { method: "POST", body: { what: d.run } }); toast({ scan: "Scan started", discover: "Looking for new companies", track: "Checking mail", release_held: "Held jobs released" }[d.run]); refresh(); }
  else if (d.browserAction) {
    ev.preventDefault();
    const gateId = d.gateId ?? D?.gate?.id ?? parsePending(D?.pending)?.gateId;
    if (!gateId) return toast("This gate is no longer open; reload the application.");
    t.disabled = true;
    try {
      await api(`/api/jobs/${selected}/browser`, { method: "POST", body: { action: d.browserAction, gateId } });
      toast(d.browserAction === "reserve" ? "Browser reserved" : "Browser reservation released");
    } catch {
      // api() already displays the server's error; refresh to restore the current gate.
    } finally {
      await refresh().catch(() => {});
      t.disabled = false;
    }
    return;
  }
  else if (d.act) {
    const text = d.fixed ?? (d.text ? $(d.text).value.trim() : "");
    if (d.text && !text) return toast("Type something first.");
    if (["confirmed_not_submitted", "mark_submitted"].includes(d.act) && D?.submissionAmbiguous && !confirm(d.act === "confirmed_not_submitted"
      ? "I inspected the existing employer application/account and confirmation mail and verified this application was NOT submitted. Requeue this existing application?"
      : "I verified the existing application was submitted. Mark it submitted without another submit attempt?")) return;
    const gateId = d.gateId ?? D?.gate?.id ?? parsePending(D?.pending)?.gateId;
    if (d.act === "recover") {
      if (!gateId) return toast("This gate is no longer open; reload the application.");
      t.disabled = true;
      try {
        await api(`/api/jobs/${selected}/recover`, { method: "POST", body: { gateId } });
        toast("Recovery queued");
        await refresh().catch(() => {});
      } catch {
        await refresh().catch(() => {});
      } finally {
        t.disabled = false;
      }
      return;
    }
    // Clearing a queue: after acting, move straight to the next job in this list.
    const list = ordered(), at = list.findIndex(j => j.id === selected), next = list[at + 1] ?? list[at - 1];
    t.disabled = true;
    try {
      await api(`/api/jobs/${selected}/action`, { method: "POST", body: { action: d.act, text, gateId } });
    } catch {
      await refresh().catch(() => {});
      return;
    } finally { t.disabled = false; }
    document.activeElement?.blur();
    const acted = selected, from = view;
    S = await api("/api/state");
    const stillHere = ordered().some(j => j.id === selected), goNext = next && ordered().some(j => j.id === next.id) ? next : null;
    const done = { approve: "Approved", reject: "Rejected", redo: "Redo requested", retry: "Back in the queue", respond: "Response saved · queued to resume", mark_submitted: "Marked as submitted", confirmed_not_submitted: "Verified not submitted · queued to resume" }[d.act];
    const undo = d.act === "reject" && !D?.submissionAmbiguous ? async () => { await api(`/api/jobs/${acted}/action`, { method: "POST", body: { action: "retry", text: "" } }); S = await api("/api/state"); go(from, ordered(from).some(j => j.id === acted) ? acted : null, true); } : null;
    toast(!stillHere && goNext ? `${done} · next: ${goNext.title}` : done, undo);
    if (stillHere) return refresh();
    go(view, goNext?.id ?? null, true);
    // The next job's buttons land under the same thumb: ignore taps for a moment.
    setTimeout(() => { const bar = $(".gate > .actions"); if (bar) { bar.classList.add("hold"); setTimeout(() => bar.classList.remove("hold"), 600); } }, 0);
  }
});
document.addEventListener("keydown", ev => {
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key === "s" && ev.target.id === "ptext") { ev.preventDefault(); return void saveProfile(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".row")) { ev.preventDefault(); return go(view, +ev.target.dataset.job); }
  if (ev.key === "Enter" && ev.target.id === "addurl") return $("#addbtn").click();
  if (ev.key === "Escape" && ev.target.id === "q") { query[view] = ""; ev.target.blur(); return render(); }
  if (ev.target.matches("textarea, input, select, button, a") || mod || ev.altKey || !VIEWS[view].statuses) return;
  const list = ordered(), at = list.findIndex(j => j.id === selected);
  if (ev.key === "/" && $("#q")) { ev.preventDefault(); $("#q").focus(); }
  else if (ev.key === "j" || ev.key === "k") { const n = list[at + (ev.key === "j" ? 1 : -1)]; if (n) go(view, n.id, true); }
  else if (ev.repeat) return; // a held key must not decide the next job too
  else if (ev.key === "a") $('.gate [data-act="approve"]')?.click();
  else if (ev.key === "x") $('.gate [data-act="reject"]')?.click();
  else if (/^[1-5]$/.test(ev.key) && D) { tab = ["summary", "score", "resume", "posting", "log"][+ev.key - 1]; render(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "ptext") return void (profileDirty = true);
  if (ev.target.id !== "q") return;
  query[view] = ev.target.value;
  render();
});
addEventListener("beforeunload", ev => { if (profileDirty) ev.preventDefault(); });
addEventListener("hashchange", route);

// The stream doubles as the connection check: while it is down, say so instead of showing stale state as current.
const stream = new EventSource("/api/stream"), offline = on => ($("#offline").hidden = !on);
stream.onmessage = refresh;
stream.onerror = () => offline(true);
stream.onopen = () => { if (!$("#offline").hidden) { offline(false); refresh(); } };
api("/api/state").then(s => { S = s; route(); }, () => offline(true));
</script>
