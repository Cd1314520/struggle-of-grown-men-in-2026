# Example: copied into profile/ the first time the app started. Optional.
#
# Employers whose category is settled by hand. A posting shows poorly what kind of organisation an
# employer is, so a listed employer overrides what the assessment judges. Names match the way jobs
# are grouped by employer (case, punctuation and Inc/LLC ignored). Edits take effect on the next job.
#
#   frontier  the employers you most want: always target employers, whatever targets.describe in
#             config.yml says. Never spent on practice; held while target employers are held back.
#   practice  employers that are never targets: always fine to practise on. An employer judged to fit
#             targets.describe is never practice on its own judgment; listing it here is the only way.

frontier: []

practice: []
